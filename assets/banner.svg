<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Escriptori al Núvol">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="150" fill="#f472b6" opacity="0.35" filter="url(#glow)"/>
  <circle cx="170" cy="330" r="160" fill="#38bdf8" opacity="0.25" filter="url(#glow)"/>
  <!-- núvols -->
  <g fill="#ffffff" opacity="0.10">
    <ellipse cx="1080" cy="300" rx="110" ry="40"/><ellipse cx="1030" cy="280" rx="60" ry="45"/><ellipse cx="1110" cy="270" rx="55" ry="40"/>
    <ellipse cx="640" cy="60" rx="80" ry="26"/><ellipse cx="610" cy="48" rx="40" ry="30"/>
  </g>
  <!-- monitor -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="330" height="210" rx="18" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="96" y="86" width="298" height="166" rx="8" fill="url(#screen)"/>
    <!-- finestres -->
    <rect x="112" y="102" width="150" height="96" rx="6" fill="#0f172a" opacity="0.85"/>
    <circle cx="124" cy="113" r="4" fill="#f43f5e"/><circle cx="137" cy="113" r="4" fill="#fbbf24"/><circle cx="150" cy="113" r="4" fill="#34d399"/>
    <circle cx="187" cy="158" r="26" fill="url(#orange)"/>
    <circle cx="187" cy="158" r="11" fill="#1e3a8a"/>
    <rect x="276" y="120" width="102" height="108" rx="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="327" cy="160" r="20" fill="#ea4335"/><path d="M327 140 a20 20 0 0 1 17.3 30 l-17.3 -10z" fill="#fbbc05"/><path d="M309.7 170 a20 20 0 0 0 34.6 0 l-17.3 -10z" fill="#34a853"/><circle cx="327" cy="160" r="8" fill="#4285f4" stroke="#fff" stroke-width="3"/>
    <rect x="96" y="236" width="298" height="16" fill="#0f172a" opacity="0.75"/>
    <rect x="104" y="240" width="8" height="8" rx="2" fill="#38bdf8"/>
    <rect x="218" y="280" width="54" height="34" fill="#1e293b"/>
    <rect x="180" y="312" width="130" height="10" rx="5" fill="#334155"/>
  </g>
  <!-- text -->
  <text x="470" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Escriptori al Núvol</text>
  <text x="472" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#e9d5ff">KDE Plasma · Blender · Google Chrome</text>
  <text x="472" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#e9d5ff">directament al teu navegador</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="472" y="282" width="168" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
    <text x="556" y="308" text-anchor="middle" fill="#ffffff">⚡ 1 clic</text>
    <rect x="652" y="282" width="210" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
    <text x="757" y="308" text-anchor="middle" fill="#ffffff">🔓 Sense contrasenya</text>
    <rect x="874" y="282" width="150" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
    <text x="949" y="308" text-anchor="middle" fill="#ffffff">💸 Gratis</text>
  </g>
</svg>
